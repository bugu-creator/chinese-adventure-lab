erflow:hidden;margin:13px 0 19px}.progress>div{height:100%;background:linear-gradient(90deg,#5d6ef0,#ba8de8);transition:width .25s}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.matchcol{display:grid;gap:10px}.choice{min-height:61px;padding:12px 13px;background:#f7f8fe;border:2px solid #e8ebf8;border-radius:13px;font-weight:720;color:var(--ink);text-align:center}.choice.selected{border-color:#596cef;background:#e8edff}.choice.correct{border-color:#3cb695;background:#e1fff1;color:#146b55}.choice.wrong{border-color:#f48b93;background:#fff0f1}.question{font-size:clamp(25px,4vw,39px);font-weight:850;margin:22px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feedback{padding:14px;border-radius:13px;margin:13px 0;background:#e7fff5;color:#116c54;font-weight:650}.feedback.bad{background:#fff0f1;color:#b23748}.note{background:#fff8e1;border:1px solid #ffe49a;border-radius:14px;padding:14px;font-size:14px;line-height:1.6;margin:15px 0}.rolecard{border-radius:22px;background:linear-gradient(140deg,#262e66,#6453a9);color:white;padding:34px 16px;text-align:center;margin:17px 0;min-height:175px;display:flex;flex-direction:column;justify-content:center}.rolecard .word{font-size:48px;font-weight:850;margin:7px}.rolecard small{color:#e4ddff}.countstep{display:flex;align-items:center;gap:12px;margin:14px 0}.countstep input{width:78px;padding:9px;border:1px solid var(--line);border-radius:10px}.drawtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:13px 0}.color{width:27px;height:27px;border-radius:50%;border:2px solid #d1d6e5}.color.on{outline:3px solid #8797ff}.canvaswrap{background:white;border:2px dashed #d4daf0;border-radius:16px;overflow:hidden;touch-action:none}.canvaswrap canvas{width:100%;height:310px;display:block;touch-action:none;cursor:crosshair}.muted{color:#7b859d;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gametile{border:1px solid var(--line);border-radius:18px;padding:18px;min-he </style></head><body><header><div class="brand">🏮 中文冒险岛 <small>CHINESE ADVENTURE LAB · CLASSROOM DEMO</small></div><a class="tag" href="/" style="color:white;text-decoration:none">← 返回冒险岛首页</a></header><div class="container"><div class="hero"><div><div class="topline">LEVEL UP YOUR CHINESE · 学中文，玩起来</div><h1>每一课，都是一场冒险！</h1><p>先朗读，再匹配，接着冲刺答题，最后和同学一起玩“谁是卧底”或“你画我猜”。</p></div><div class="mascot" aria-hidden="true">🐼</div></div><div class="stats"><div class="stat"><b id="points">0</b><span>⭐ 本轮积分</span></div><div class="stat"><b id="matchstat">0/5</b><span>🧩 配对进度</span></div><div class="stat"><b id="quizstat">0/5</b><span>⚡ 问答进度</span></div><div class="stat"><b id="petstat">🥚</b><span>🐣 成长伙伴</span></div></div><div class="main"><aside class="side" id="navigation"></aside><main class="panel"><div class="unitbar"><span class="pill">学习单元 · Lesson Pack</span><select id="lessonPicker" aria-label="选择课程"><option value="l1">第一课 · 数字和朋友</option><option value="l2">第二课 · 日期和生日</option></select></div><div id="content" aria-live="polite"></div></main></div><div class="foot">课堂试用版 · 无需登录 · 数据仅保留在当前页面内 · 非教材官方产品</div></div>
<script>
'use strict';
const PACKS={
 l1:{title:'第一课 · 数字和朋友',topic:'数字 · Numbers',reading:[['一、二、三、四、五。','Yī, èr, sān, sì, wǔ.'],['六、七、八、九、十。','Liù, qī, bā, jiǔ, shí.'],['我有三个好朋友。','Wǒ yǒu sān gè hǎo péngyou.'],['你有几个好朋友？','Nǐ yǒu jǐ gè hǎo péngyou?']],matches:[['一','one'],['三','three'],['十','ten'],['朋友','friend'],['有','have']],questions:[{q:'“八” 的英文是？ / What does 八 mean?',a:['six','eight','nine','ten'],correct:1,tip:'八 = eight'},{q:'“friend” 的中文是？ / Which Chinese word means friend?',a:['朋友','我','有','好'],correct:0,tip:'朋友 péngyou = friend'},{q:'“我有三个好朋友”是什么意思？ / What does this sentence mean?',a:['I am three.','I have three good friends.','I have ten books.','I like Chinese.'],correct:1,tip:'我有…个… = I have …'},{q:'五 + 三 = ?',a:['六','七','八','九'],correct:2,tip:'五 + 三 = 八 / five + three = eight'},{q:'In “你有几个好朋友？”, what does “几个” ask about?',a:['Name','Place','Quantity (how many)','Time'],correct:2,tip:'几个 = how many'}],spy:[['三','四'],['六','九'],['朋友','同学'],['五','八']],draw:['一','二','三','八','十','朋友','五个朋友']},
 l2:{title:'第二课 · 日期和生日',topic:'日期 · Dates',reading:[['今天是星期二。','Jīntiān shì xīngqī èr.'],['今天是我的生日。','Jīntiān shì wǒ de shēngrì.'],['一个星期有七天。','Yí gè xīngqī yǒu qī tiān.'],['今天是十一月十号。','Jīntiān shì shíyī yuè shí hào.']],matches:[['今天','today'],['生日','birthday'],['星期','week'],['月','month'],['号','date / day of month']],questions:[{q:'“今天”是什么意思？',a:['tomorrow','today','year','Monday'],correct:1,tip:'今天 = today'},{q:'“生日”的英文是？',a:['birthday','week','month','day'],correct:0,tip:'生日 = birthday'},{q:'一个星期有几天？',a:['五天','六天','七天','八天'],correct:2,tip:'一个星期有七天'},{q:'“星期二”是？',a:['Monday','Tuesday','Thursday','Sunday'],correct:1,tip:'星期二 = Tuesday'},{q:'“十一月”是？',a:['October','December','September','November'],correct:3,tip:'十一月 = November'}],spy:[['星期一','星期二'],['今天','明天'],['生日','日期'],['大月','小月']],draw:['生日蛋糕','星期一','星期日','日历','七天']}
};
let packKey='l1',step='intro',points=0,done={read:false,match:false,quiz:false},matched=[],selectedLeft=-1,selectedRight=-1,matchOrder=[],qIndex=0,quizCorrect=0,quizAnswered=false,quizStart=0,spyRound=0,spyPlayers=5,spyIndex=0,spyDeck=[],spyFlipped=false,drawWord='',drawShown=false,drawTimer=null,drawSeconds=60,pen='#26345f',penSize=4,painting=false,ctx=null,showPinyin=true,studentName='';
const $=id=>document.getElementById(id),p=()=>PACKS[packKey],random=n=>Math.floor(Math.random()*n),shuffle=a=>[...a].sort(()=>Math.random()-.5);function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStep(s){step=s;if(drawTimer){clearInterval(drawTimer);drawTimer=null}render();window.scrollTo({top:0,behavior:'smooth'})}function finish(type){done[type]=true;stats()}function score(n){points+=n;stats()}function stats(){$('points').textContent=points;$('matchstat').textContent=matched.length+'/5';$('quizstat').textContent=qIndex+'/5';$('petstat').textContent=points>=120?'🐉':points>=80?'🐼':points>=35?'🐣':'🥚'}function nav(){let titles=[['intro','🏝️','冒险首页','Choose a challenge'],['read','📖','朗读热身','Read aloud'],['match','🧩','词汇匹配','Match the words'],['quiz','⚡','竞速问答','Quiz challenge'],['games','🎲','趣味游戏','Play together'],['spy','🕵️','谁是卧底','Undercover'],['draw','🎨','你画我猜','Draw & guess'],['teacher','⚙️','教师说明','Teacher guide']];$('navigation').innerHTML='<h3>学习路线 · GAME MAP</h3>'+titles.map(([id,em,t,d])=>`<button class="stage ${step===id?'active':''} ${done[id]?'done':''}" data-stage="${id}"><span class="bubble">${done[id]?'✓':em}</span><span>${t}<small>${d}</small></span></button>`).join('');document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>setStep(b.dataset.stage)))}function render(){nav();stats();let out='';if(step==='intro')out=intro();if(step==='read')out=read();if(step==='match')out=match();if(step==='quiz')out=quiz();if(step==='games')out=games();if(step==='spy')out=spy();if(step==='draw')out=draw();if(step==='teacher')out=teacher();$('content').innerHTML=out;wire();}
function intro(){return `<span class="pill">START YOUR JOURNEY</span><h2 class="section-title">欢迎来到中文游戏岛！</h2><p class="sub">今天的主题：${p().topic}。你会通过四个学习关卡，解锁一场和同伴合作或竞争的中文游戏。</p><div class="cards"><div class="gametile"><div class="emoji">📖</div><h3>朗读热身</h3><p>用中文读句子，逐渐隐藏拼音。</p></div><div class="gametile"><div class="emoji">🧩</div><h3>词汇匹配</h3><p>汉字与英文连连看，做对积累分数。</p></div><div class="gametile"><div class="emoji">🏆</div><h3>竞技问答</h3><p>五道题倒计时，快和准都很重要。</p></div></div><div class="buttons"><button class="btn primary" data-next="read">进入第一关 →</button><button class="btn ghost" data-next="games">直接试玩游戏</button></div><p class="muted">适合教师投屏带全班玩，或学生用同一台设备轮流操作；目前不是跨设备联机版。</p>`}
function read(){return `<span class="pill">关卡 1 / 3 · READ & SPEAK</span><h2 class="section-title">📖 朗读热身</h2><p class="sub">跟同伴轮流朗读：第一遍看拼音，第二遍隐藏拼音。句子是围绕本课知识点原创编写的示例，不是教材课文复制。</p><div class="toggleline"><label><input id="pinyinToggle" type="checkbox" ${showPinyin?'checked':''}> 显示拼音 / Show pinyin</label><button class="btn ghost" id="readSpeak">🔊 朗读示范（设备语音）</button></div><div class="reading">${p().reading.map(([han,py])=>`<div class="line">${escapeHTML(han)}${showPinyin?`<div class="pinyin">${escapeHTML(py)}</div>`:''}</div>`).join('')}</div><div class="note">🎤 课堂建议：两人一组，A 读中文，B 用英语解释；然后交换角色。</div><div class="buttons"><button class="btn primary" id="readDone">我已完成朗读 · +15 ⭐</button><button class="btn ghost" data-next="match">继续词汇匹配 →</button></div>`}
function resetMatch(){matched=[];selectedLeft=-1;selectedRight=-1;matchOrder=shuffle([0,1,2,3,4]);render()}function match(){return `<span class="pill">关卡 2 / 3 · MATCHING</span><h2 class="section-title">🧩 词汇闪电配对</h2><p class="sub">先点左边的中文，再点右边的英文。匹配成功即可得分。</p><div class="progress"><div style="width:${matched.length*20}%"></div></div><div class="matchgrid"><div class="matchcol">${p().matches.map(([zh],i)=>`<button class="choice ${matched.includes(i)?'correct':selectedLeft===i?'selected':''}" data-left="${i}" ${matched.includes(i)?'disabled':''}>${escapeHTML(zh)}</button>`).join('')}</div><div class="matchcol">${matchOrder.map(i=>`<button class="choice ${matched.includes(i)?'correct':selectedRight===i?'selected':''}" data-right="${i}" ${matched.includes(i)?'disabled':''}>${escapeHTML(p().matches[i][1])}</button>`).join('')}</div></div><div class="buttons"><button class="btn ghost" id="resetMatch">重新匹配</button>${matched.length===5?'<button class="btn primary" data-next="quiz">完成！前往竞速问答 →</button>':''}</div><div id="matchFeedback" aria-live="polite"></div>`}
function chooseMatch(side,i){if(matched.includes(i))return;if(side==='left')selectedLeft=i;else selectedRight=i;if(selectedLeft>=0&&selectedRight>=0){let success=selectedLeft===selectedRight;if(success){matched.push(selectedLeft);score(10);if(matched.length===5)finish('match')}else{points=Math.max(0,points-2)}selectedLeft=-1;selectedRight=-1;render();$('matchFeedback').innerHTML=`<div class="feedback ${success?'':'bad'}">${success?'✅ 配对正确！+10 ⭐':'🔁 再试一次！-2 ⭐'}</div>`}else render()}
function quiz(){if(qIndex>=5)return `<span class="pill">关卡 3 / 3 · RESULTS</span><h2 class="section-title">🎉 竞速挑战完成！</h2><div class="question">答对 ${quizCorrect} / 5 题</div><p class="sub">每题答对加分。可以重新挑战，也可以进入团队游戏。</p><div class="buttons"><button class="btn primary" data-next="games">解锁趣味游戏 →</button><button class="btn ghost" id="resetQuiz">重新挑战</button></div>`;let q=p().questions[qIndex];return `<span class="pill">关卡 3 / 3 · SPEED QUIZ</span><h2 class="section-title">⚡ 竞速问答</h2><p class="sub">第 ${qIndex+1} / 5 题 · 正确 +10 分 · 10 秒内作答额外 +5 分</p><div class="progress"><div style="width:${qIndex*20}%"></div></div><div class="question">${escapeHTML(q.q)}</div><div class="answers">${q.a.map((a,i)=>`<button class="choice" data-answer="${i}" ${quizAnswered?'disabled':''}>${escapeHTML(String.fromCharCode(65+i))}. ${escapeHTML(a)}</button>`).join('')}</div><div id="quizFeedback" aria-live="polite"></div>`}
function chooseAnswer(i){if(quizAnswered)return;quizAnswered=true;let q=p().questions[qIndex],ok=i===q.correct,fast=(Date.now()-quizStart)<10000;if(ok){quizCorrect++;score(10+(fast?5:0))}document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;{const state=Number(b.dataset.answer)===q.correct?'correct':Number(b.dataset.answer)===i?'wrong':null;if(state)b.classList.add(state)}});$('quizFeedback').innerHTML=`<div class="feedback ${ok?'':'bad'}">${ok?`✅ 正确！+${fast?15:10} ⭐`:'💡 再记住这个知识点：'} ${escapeHTML(q.tip)}</div><button class="btn primary" id="nextQ">${qIndex===4?'查看成绩 →':'下一题 →'}</button>`;$('nextQ').onclick=()=>{qIndex++;quizAnswered=false;if(qIndex===5)finish('quiz');quizStart=Date.now();render()}}
function games(){return `<span class="pill">BONUS ROUND · PLAY TOGETHER</span><h2 class="section-title">🎲 选择你的团队挑战</h2><p class="sub">这些游戏使用当前课程的词库。可以分小组轮流玩，练习口语描述、理解、听力和词汇回忆。</p><div class="cards"><div class="gametile"><div class="emoji">🕵️</div><h3>谁是卧底</h3><p>每人用自己的设备加入房间，查看自己的词，再讨论投票。</p><button class="btn primary" data-next="spy">开始游戏</button></div><div class="gametile"><div class="emoji">🎨</div><h3>你画我猜</h3><p>一人看词画图，队友限时用中文猜词。</p><button class="btn primary" data-next="draw">开始游戏</button></div><div class="gametile"><div class="emoji">🐼</div><h3>伙伴成长</h3><p>⭐ 积分帮助宠物成长。当前为单设备试玩版本。</p><button class="btn ghost" data-next="intro">返回首页</button></div></div><div class="note">💬 谁是卧底建议口语句型：“我的词和数字有关。”“它比五大。”“我觉得……是卧底，因为……” 第一课的词义较简单，卧底对词也包括少量延伸词，老师可按学生水平调整。</div>`}
function startSpy(){let words=p().spy[random(p().spy.length)],spyPos=random(spyPlayers);spyDeck=Array.from({length:spyPlayers},(_,i)=>i===spyPos?words[1]:words[0]);spyIndex=0;spyFlipped=false;spyRound++;render()}function spy(){return `<span class="pill">CLASSROOM MULTIPLAYER</span><h2 class="section-title">谁是卧底 · 多人房间</h2><p class="sub">每个人用自己的设备加入房间，系统自动分配秘密词语，每人只看自己的词。<br>Join on your own device. Receive and view your own secret word.</p><div class="buttons"><a class="btn primary" href="/undercover.html">进入多人房间 / Open room →</a><button class="btn ghost" data-next="games">返回游戏中心 / Back</button></div><p class="muted">需要新版 Node 房间服务；第一课新词库仍待教师审核。</p>`}
function draw(){return `<span class="pill">TEAM GAME · DRAW & GUESS</span><h2 class="section-title">🎨 你画我猜 · 多人版</h2><p class="sub">教师创建房间，学生通过自己的 iPad 或电脑加入。系统轮流选择画画者，题目只显示在画画者的屏幕上；其他学生只需选择答案或输入中文。无需复杂画笔工具。</p><div class="teacherbox"><b>游戏流程</b><p>👩‍🏫 教师创建房间 → 🎒 学生输入房间码 → 🎨 系统指定画画者 → 👀 其他学生看同步画板并答题 → ⭐ 自动计分。</p></div><div class="buttons"><a class="btn primary" href="multiplayer.html" style="text-decoration:none">进入多人游戏 →</a><button class="btn ghost" data-next="games">返回游戏大厅</button></div><p class="muted">注意：多人联机需要运行随项目附带的 server.js。直接双击本地 HTML 文件无法跨设备同步。参见 README。</p>`}
function teacher(){return `<span class="pill">FOR TEACHERS · PILOT</span><h2 class="section-title">⚙️ 教师使用说明</h2><p class="sub">这是一份独立 HTML 课堂原型：适合投影、小组共用设备和老师带领的课堂游戏。不需要账号或联网。</p><div class="teacherbox"><b>建议的 45–60 分钟课堂流程</b><p>朗读 7–10 分钟 → 词汇匹配 8–10 分钟 → 竞技问答 10 分钟 → 谁是卧底 / 你画我猜 15–20 分钟 → 口头总结 5 分钟。</p></div><div class="teacherbox"><b>现阶段真实支持的功能</b><p>✅ 两个示例课包；拼音显隐；设备语音朗读；点击配对；本机计分；竞速加分；轮流查看卧底卡；触控画板和倒计时。</p><p>⏳ 尚未接入的功能：学生及教师账号、跨设备同步、实时排行榜、后台编辑课包、云端保存、音频评测、数据报告和宠物跨课成长。</p></div><div class="teacherbox"><b>公开站点版权原则</b><p>演示题目以教材知识点为参考、重新编写。上线时不上传教材扫描页、原版长课文或受版权保护的原图；由教师使用原创或已获授权素材。</p></div><div class="buttons"><button class="btn ghost" id="resetAll">重置当前课的积分与进度</button><button class="btn primary" data-next="intro">返回首页</button></div>`}
function setupCanvas(){let c=$('drawing');if(!c)return;let rect=c.getBoundingClientRect(),scale=window.devicePixelRatio||1;c.width=Math.round(rect.width*scale);c.height=Math.round(310*scale);ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.lineCap='round';ctx.lineJoin='round';ctx.fillStyle='white';ctx.fillRect(0,0,rect.width,310);let last=null;function loc(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{e.preventDefault();painting=true;c.setPointerCapture(e.pointerId);last=loc(e)});c.addEventListener('pointermove',e=>{if(!painting)return;e.preventDefault();let now=loc(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(now.x,now.y);ctx.strokeStyle=pen;ctx.lineWidth=penSize;ctx.stroke();last=now});for(const type of ['pointerup','pointercancel','pointerleave'])c.addEventListener(type,()=>{painting=false;last=null})}
function wire(){document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>setStep(b.dataset.next));if(step==='read'){$('pinyinToggle').onchange=e=>{showPinyin=e.target.checked;render()};$('readDone').onclick=()=>{if(!done.read){score(15);finish('read')}setStep('match')};$('readSpeak').onclick=()=>{if(!('speechSynthesis'in window)){alert('当前浏览器不支持设备语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(p().reading.map(x=>x[0]).join('。'));u.lang='zh-CN';u.rate=.78;speechSynthesis.speak(u)}}if(step==='match'){document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>chooseMatch('left',+b.dataset.left));document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>chooseMatch('right',+b.dataset.right));$('resetMatch').onclick=resetMatch}if(step==='quiz'){if(qIndex<5){if(!quizStart)quizStart=Date.now();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>chooseAnswer(+b.dataset.answer))}else $('resetQuiz').onclick=()=>{qIndex=0;quizCorrect=0;quizStart=Date.now();quizAnswered=false;render()}}if(step==='draw' && $('newDraw')){setupCanvas();$('newDraw').onclick=()=>{drawWord=p().draw[random(p().draw.length)];drawShown=true;drawSeconds=60;render()};if($('toggleDrawWord'))$('toggleDrawWord').onclick=()=>{drawShown=!drawShown;render()};$('drawTimerButton').onclick=()=>{if(drawTimer){clearInterval(drawTimer);drawTimer=null;return}drawTimer=setInterval(()=>{drawSeconds=Math.max(0,drawSeconds-1);if($('drawClock'))$('drawClock').textContent='⏱ '+drawSeconds+' 秒';if(!drawSeconds){clearInterval(drawTimer);drawTimer=null;alert('时间到！')}},1000)};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{pen=b.dataset.color;penSize=4;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('on',x.dataset.color===pen))});$('eraseDraw').onclick=()=>{pen='#ffffff';penSize=18;document.querySelectorAll('[data-color]').forEach(x=>x.classList.remove('on'))};$('clearDraw').onclick=()=>{let c=$('drawing');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)};$('guessed').onclick=()=>{if(!drawWord){alert('请先抽取题目');return}score(20);alert('🎉 答对了！+20 ⭐');drawWord='';drawShown=false;render()}}if(step==='teacher'){$('resetAll').onclick=()=>{reset();setStep('intro')}}}
function reset(){points=0;done={read:false,match:false,quiz:false};matched=[];selectedLeft=-1;selectedRight=-1;matchOrder=shuffle([0,1,2,3,4]);qIndex=0;quizCorrect=0;quizAnswered=false;quizStart=0;spyDeck=[];spyIndex=0;drawWord='';drawShown=false;drawSeconds=60;showPinyin=true}reset();$('lessonPicker').addEventListener('change',e=>{packKey=e.target.value;reset();setStep('intro')});
const entryParams=new URLSearchParams(location.search);
if(Object.hasOwn(PACKS,entryParams.get('lesson')))packKey=entryParams.get('lesson');
$('lessonPicker').value=packKey;
const entryStep=entryParams.get('step');
if(['intro','read','match','quiz','games','spy','draw','teacher'].includes(entryStep))step=entryStep;
render();
