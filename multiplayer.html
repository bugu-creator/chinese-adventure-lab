<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>你画我猜 · 多人课堂版</title><style>
:root{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#1e2848;background:#f6f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#e3e4ff,transparent 45%),#f8f9ff}header{padding:17px 22px;background:#151d43;color:white;font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.shell{max-width:1050px;margin:24px auto;padding:0 15px 70px}.card{background:white;padding:24px;border:1px solid #e3e7f2;box-shadow:0 10px 25px #272e6011;border-radius:22px;margin-bottom:17px}.hero{background:linear-gradient(110deg,#5567e8,#9875e0);color:white}.hero h1{margin:0 0 9px;font-size:clamp(23px,4vw,34px)}.hero p{margin:0;opacity:.94;line-height:1.6}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.btn{background:#eef0ff;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:750;color:#3247bd;cursor:pointer}.primary{background:#5666e7;color:white}.green{background:#117c63;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}input,select{border:1px solid #d8dcf0;border-radius:11px;padding:12px;font-size:17px;max-width:100%;width:100%;margin:9px 0 14px;background:white}.field{font-size:13px;color:#5f6b84;font-weight:700}.muted{color:#66718d;line-height:1.7}.hint{font-size:13px;color:#65708e}.big{font-size:36px;font-weight:850}.code{font-size:38px;letter-spacing:5px;color:#4e5ed8;font-weight:850}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:8px 12px;border-radius:999px;background:#ecf0ff;font-size:14px;font-weight:700}.canvasbox{border:2px solid #dce1f3;border-radius:17px;background:white;overflow:hidden;margin:14px 0;touch-action:none}canvas{width:100%;height:auto;aspect-ratio: 1.65;touch-action:none;display:block;background:white}.answergrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.answergrid .btn{padding:20px 10px;font-size:22px}.secret{background:#20275e;color:white;border-radius:17px;padding:22px;font-size:40px;text-align:center;font-weight:850;margin:13px 0}.timer{font-size:19px;font-weight:800;background:#fff6db;padding:10px 15px;border-radius:999px}.message{background:#e8fff1;border-radius:12px;padding:14px;font-weight:700}.error{color:#bd3044;background:#ffedf0;padding:13px;border-radius:12px}.hidden{display:none!important}@media(max-width:650px){.two{grid-template-columns:1fr}.card{padding:18px}.answergrid .btn{font-size:19px}.code{font-size:31px}}
</style></head><body><header><span>🏮 中文冒险岛 · 你画我猜</span><a href="/" style="color:white">← 返回首页</a></header><div class="shell"><div class="card hero"><h1>一人画画，全班来猜！</h1><p>每位学生用自己的设备加入房间。只有画画者看到词语，其他同学选择或输入中文答案。</p></div><div id="error" class="hidden error"></div><section id="entry" class="two"><div class="card"><h2>👩‍🏫 我是教师</h2><p class="muted">创建房间、切换答题模式、控制每轮游戏。</p><label class="field">选择课程</label><select id="lesson"><option value="l1">第一课 · 数字和朋友</option><option value="l2">第二课 · 日期和生日</option></select><button class="btn primary" id="create">创建游戏房间</button></div><div class="card"><h2>🎒 我是学生</h2><label class="field">房间码</label><input id="joinCode" placeholder="输入教师提供的6位房间码" maxlength="6" autocapitalize="characters"><label class="field">昵称（请使用课堂昵称）</label><input id="joinName" placeholder="例如 Panda 7" maxlength="22"><button class="btn primary" id="join">加入游戏</button></div></section><div id="session" class="hidden"><div class="card"><div class="row"><div><span class="hint">房间码 Room code</span><div id="code" class="code"></div></div><div style="flex:1"></div><div id="timer" class="timer"></div></div><p class="hint">学生访问同一个网址，输入房间码加入。游戏仅在本次服务器运行期间有效。</p><div id="people" class="chips"></div></div><div id="stage" class="card"></div></div><div class="card hint">教学演示说明：无需登录，昵称与得分只临时存放在教师运行的服务器内。请勿使用真实姓名。此版本适用于学校受信任的局域网，不应直接公开部署到互联网。</div></div><script>
'use strict';let room='',token='',state=null,stream=null,strokesCount=0,ctx=null,canvas=null,painting=false,lastPoint=null,busy=false;
const el=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function err(t){el('error').textContent=t;el('error').classList.remove('hidden');setTimeout(()=>el('error').classList.add('hidden'),4500)}
async function call(endpoint,data){let res=await fetch('/api/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,token,...data})});let out=await res.json();if(!res.ok)throw Error(out.error||'请求失败');return out}
function connect(){el('entry').classList.add('hidden');el('session').classList.remove('hidden');el('code').textContent=room;stream?.close();stream=new EventSource('/api/events?room='+encodeURIComponent(room)+'&token='+encodeURIComponent(token));stream.onmessage=e=>{try{show(JSON.parse(e.data))}catch(x){err(x.message)}};stream.onerror=()=>err('连接中断，正在尝试重新连接…')}
el('create').onclick=async()=>{try{let r=await call('create',{lesson:el('lesson').value});room=r.room;token=r.token;connect()}catch(e){err(e.message)}};
el('join').onclick=async()=>{try{let r=await call('join',{room:el('joinCode').value.trim().toUpperCase(),name:el('joinName').value});room=r.room;token=r.token;connect()}catch(e){err(e.message)}};
function show(s){let old=state;state=s;el('timer').textContent=s.phase==='playing'?'⏱ '+s.remaining+'s':s.phase==='result'?'✅ 本轮结束':'⏳ 等待开始';el('people').innerHTML=s.players.map(p=>`<span class="chip">${p.id===s.drawerId?'🎨 ':''}${safe(p.name)} · ⭐${p.score}${p.answered?' ✓':''}</span>`).join('')||'<span class="hint">等待学生加入…</span>';
 const rebuild=!old||old.phase!==s.phase||old.roundId!==s.roundId||old.isDrawer!==s.isDrawer||old.mode!==s.mode||old.isHost!==s.isHost||old.meId!==s.meId||old.players.length!==s.players.length||old.players.find(p=>p.id===s.meId)?.answered!==s.players.find(p=>p.id===s.meId)?.answered;
 if(rebuild){renderStage(s);strokesCount=0}if(s.phase==='playing'){drawAll(s.strokes)}
 if(s.message){let m=el('flash');if(m)m.textContent=s.message}
}
function renderStage(s){let out='';if(s.phase==='lobby'){
 out=`<h2>👋 等待玩家加入</h2><p class="muted">至少两名学生加入后，教师可以开始。系统会轮流挑选画画者。</p>${s.isHost?`<label class="field">其他同学如何回答？</label><select id="mode"><option value="choice" ${s.mode==='choice'?'selected':''}>四选一 · 选择正确答案</option><option value="type" ${s.mode==='type'?'selected':''}>自己写 · 输入中文答案</option></select><button id="start" class="btn primary">开始第一轮 →</button>`:'<div class="message">已加入！等待教师开始。</div>'}`;
 }else if(s.phase==='result'){
 out=`<h2>🎉 本轮结束</h2><p class="big">${safe(s.results?.word)}</p><p class="muted">答对的同学：${safe(s.results?.winners?.join('、')||'本轮无人答对')}</p>${s.isHost?'<button id="start" class="btn primary">下一轮 · 更换画画者 →</button>':'<p class="message">等待教师开始下一轮</p>'}`;
 }else if(s.isHost){out=`<h2>👩‍🏫 教师控制台</h2><p class="muted">当前画画者：<strong>${safe(s.drawerName)}</strong> · 模式：${s.mode==='choice'?'四选一':'写答案'}</p><div class="secret">${safe(s.word)}</div><div id="flash" class="message">正在绘画…</div><div class="canvasbox"><canvas id="board" width="900" height="545"></canvas></div><button id="end" class="btn">结束本轮</button>`;
 }else if(s.isDrawer){out=`<h2>🎨 轮到你画画！</h2><p class="muted">只在你的屏幕显示题目。不要写出汉字，也不要说出答案。</p><div class="secret">${safe(s.word)}</div><div class="canvasbox"><canvas id="board" width="900" height="545"></canvas></div><div class="row"><button id="clear" class="btn">🧹 清空重画</button><span class="hint">用手指、Apple Pencil 或鼠标画画</span></div><p id="flash" class="message">同学们正在猜…</p>`;
 }else{out=`<h2>👀 猜猜画的是什么？</h2><p class="muted">画画的人是 ${safe(s.drawerName)}。仔细观察，选择或输入正确答案。</p><div class="canvasbox"><canvas id="board" width="900" height="545"></canvas></div>${s.players.find(p=>p.id===s.meId)?.answered?'<div class="message">✅ 已提交答案，等待其他同学。</div>':s.mode==='choice'?`<div class="answergrid">${(s.options||[]).map(x=>`<button class="btn" data-answer="${safe(x)}">${safe(x)}</button>`).join('')}</div>`:`<form id="answerForm"><label class="field" for="answerText">用中文输入答案</label><input id="answerText" autocomplete="off" placeholder="写出你猜的词语"><button class="btn primary" type="submit">提交答案</button></form>`}<p id="flash" class="hint">加油！</p>`}
 el('stage').innerHTML=out;const start=el('start');if(start)start.onclick=()=>call('start',{}).catch(e=>err(e.message));const mode=el('mode');if(mode)mode.onchange=()=>call('config',{mode:mode.value}).catch(e=>err(e.message));const end=el('end');if(end)end.onclick=()=>call('end',{}).catch(e=>err(e.message));const clear=el('clear');if(clear)clear.onclick=()=>call('clear',{}).catch(e=>err(e.message));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));const form=el('answerForm');if(form)form.onsubmit=e=>{e.preventDefault();answer(el('answerText').value)};canvas=el('board');ctx=canvas?.getContext('2d');if(ctx){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=7;if(s.isDrawer)setupDraw()}
}
async function answer(a){if(busy)return;busy=true;try{let r=await call('answer',{answer:a});if(r.correct){el('flash')&&(el('flash').textContent='🎉 答对了！')}else{el('flash')&&(el('flash').textContent='已提交，下一轮继续加油！')} }catch(e){err(e.message)}finally{busy=false}}
function drawAll(strokes){if(!ctx||!canvas)return;if(strokes.length<strokesCount){ctx.clearRect(0,0,900,545);strokesCount=0}for(let i=strokesCount;i<strokes.length;i++){let pts=strokes[i].points;if(!pts.length)continue;ctx.beginPath();ctx.moveTo(pts[0][0]*900,pts[0][1]*545);if(pts.length===1){ctx.lineTo(pts[0][0]*900+.2,pts[0][1]*545+.2)}else for(const p of pts.slice(1))ctx.lineTo(p[0]*900,p[1]*545);ctx.strokeStyle='#26345f';ctx.lineWidth=7;ctx.stroke()}strokesCount=strokes.length}
function setupDraw(){let pts=[];const position=e=>{let r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]};canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);pts=[position(e)];lastPoint=pts[0];e.preventDefault()};canvas.onpointermove=e=>{if(!painting)return;let v=position(e);if(Math.hypot(v[0]-lastPoint[0],v[1]-lastPoint[1])<.004)return;ctx.beginPath();ctx.moveTo(lastPoint[0]*900,lastPoint[1]*545);ctx.lineTo(v[0]*900,v[1]*545);ctx.stroke();pts.push(v);lastPoint=v;e.preventDefault();if(pts.length>=35)flush()};const flush=()=>{if(!pts.length)return;let send=pts;pts=pts.length?[pts[pts.length-1]]:[];call('stroke',{points:send}).catch(e=>err(e.message))};canvas.onpointerup=()=>{painting=false;flush()};canvas.onpointercancel=()=>{painting=false;flush()}}
</script></body></html>
